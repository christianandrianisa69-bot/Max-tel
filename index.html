<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Max tel</title>
  <meta name="description" content="Max tel vous aide à transformer vos projets d’études ou d’emploi en petits pas concrets, à votre rythme.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Max tel">
  <meta property="og:description" content="Un espace personnel pour avancer vers un projet d’études ou d’emploi, un petit pas à la fois.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Max tel">
  <meta name="twitter:description" content="Un espace personnel pour avancer vers un projet d’études ou d’emploi, un petit pas à la fois.">
  <meta name="theme-color" content="#24584f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
/* Max tel — feuille de styles
   Polices : DM Sans + Manrope (chargées dans index.html) */

:root { --background: 42 38% 95%; --foreground: 170 27% 18%; --card: 45 35% 98%; --card-foreground: 170 27% 18%; --popover: 45 35% 98%; --popover-foreground: 170 27% 18%; --primary: 166 35% 31%; --primary-foreground: 45 38% 97%; --secondary: 39 52% 86%; --secondary-foreground: 170 27% 18%; --muted: 39 27% 90%; --muted-foreground: 167 12% 43%; --accent: 12 59% 66%; --accent-foreground: 18 39% 18%; --destructive: 4 65% 52%; --destructive-foreground: 0 0% 100%; --border: 38 23% 82%; --input: 38 23% 82%; --ring: 166 35% 31%; --radius: .9rem; --app-font-sans: 'DM Sans', sans-serif; --app-font-serif: 'Manrope', sans-serif; --app-font-mono: 'DM Sans', monospace; }

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body { margin: 0px; min-width: 320px; background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: var(--app-font-sans); }

button, input, select, textarea { font: inherit; }

button { cursor: pointer; }

.app-shell { min-height: 100dvh; }

.side-nav { width: 244px; position: fixed; inset: 0px auto 0px 0px; padding: 30px 18px; background: rgb(36, 88, 79); color: rgb(247, 243, 232); display: flex; flex-direction: column; z-index: 20; }

.brand { color: rgb(247, 243, 232); text-decoration: none; font-family: var(--app-font-serif); font-weight: 800; font-size: 23px; letter-spacing: -1px; padding: 4px 12px 36px; display: flex; gap: 10px; align-items: center; }

.brand-mark { width: 31px; height: 31px; border-radius: 11px 11px 11px 3px; background: rgb(233, 165, 140); color: rgb(36, 88, 79); display: grid; place-items: center; font-size: 17px; font-weight: 800; }

.nav-label { color: rgb(169, 196, 182); font-size: 10px; text-transform: uppercase; letter-spacing: 1.6px; padding: 0px 13px 12px; }

.nav-link { display: flex; align-items: center; gap: 12px; color: rgb(215, 229, 220); text-decoration: none; border-radius: 12px; padding: 12px 13px; margin: 3px 0px; font-weight: 600; font-size: 14px; transition: background 0.2s, transform 0.2s; }

.nav-link:hover { background: rgba(255, 255, 255, 0.086); transform: translateX(2px); }

.nav-link.active { background: rgb(244, 238, 224); color: rgb(36, 88, 79); }

.nav-footer { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.15); padding: 18px 12px 0px; color: rgb(215, 229, 220); font-size: 12px; line-height: 1.6; }

.nav-footer svg { display: block; margin-bottom: 9px; }

.nav-footer p { margin: 0px; }

.main-area { margin-left: 244px; min-height: 100dvh; padding: 44px clamp(22px, 5vw, 76px) 64px; max-width: 1600px; }

.page-topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 34px; color: rgb(96, 118, 110); font-size: 13px; }

.privacy-note { display: flex; align-items: center; gap: 7px; }

.privacy-dot { width: 7px; height: 7px; border-radius: 50%; background: rgb(134, 168, 144); }

.eyebrow { text-transform: uppercase; letter-spacing: 1.7px; font-size: 10px; font-weight: 700; color: rgb(99, 133, 122); }

h1, h2, h3, p { margin-top: 0px; }

h1 { font-family: var(--app-font-serif); font-size: clamp(30px, 4vw, 46px); letter-spacing: -1.8px; line-height: 1.12; margin: 10px 0px; }

h2 { font-family: var(--app-font-serif); font-size: 24px; letter-spacing: -0.7px; }

.lead { color: rgb(103, 123, 114); font-size: 15px; line-height: 1.65; max-width: 620px; }

.hero-accent { color: rgb(179, 110, 87); }

.hero-panel .btn { margin-top: 2px; }

.hero-panel .lead { margin-bottom: 13px; }

.hero-panel { background: rgb(220, 232, 217); border-radius: 24px; padding: 38px 40px; display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 24px; position: relative; overflow: hidden; margin-bottom: 27px; }

.hero-panel::after { content: ""; position: absolute; width: 220px; height: 220px; border: 1px solid rgba(36, 88, 79, 0.19); border-radius: 50%; right: 8%; top: -112px; box-shadow: rgba(36, 88, 79, 0.03) 0px 0px 0px 26px, rgba(36, 88, 79, 0.03) 0px 0px 0px 52px; pointer-events: none; }

.hero-aside { display: flex; align-items: center; justify-content: center; z-index: 1; }

.orbit { width: 158px; height: 158px; border: 1px solid rgb(114, 149, 138); border-radius: 50%; display: grid; place-items: center; position: relative; }

.orbit::before, .orbit::after { content: ""; position: absolute; border: 1px solid rgb(148, 175, 163); border-radius: 50%; inset: 13px; }

.orbit::after { inset: 29px; background: rgb(240, 188, 158); border: 0px; }

.orbit-core { z-index: 1; font: 800 25px var(--app-font-serif); color: rgb(36, 88, 79); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 0px; border-radius: 11px; padding: 11px 16px; background: rgb(36, 88, 79); color: rgb(251, 247, 238); font-size: 13px; font-weight: 700; text-decoration: none; transition: transform 0.18s, background 0.18s; }

.btn:hover { transform: translateY(-2px); background: rgb(23, 70, 61); }

.btn.secondary { background: rgb(237, 229, 211); color: rgb(52, 86, 77); }

.btn.secondary:hover { background: rgb(228, 217, 196); }

.btn.ghost { background: transparent; color: rgb(71, 108, 97); border: 1px solid rgb(199, 209, 199); }

.btn.danger { background: rgb(169, 68, 59); }

.btn.small { padding: 8px 11px; font-size: 12px; }

.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 34px 0px 17px; }

.section-heading h2 { margin: 0px; }

.stat-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }

.stat-box { background: rgb(245, 240, 229); border: 1px solid rgb(230, 222, 204); border-radius: 15px; padding: 18px 20px; }

.stat-value { font: 800 25px var(--app-font-serif); color: rgb(37, 89, 79); }

.stat-denominator { font-size: 15px; color: rgb(129, 144, 135); }

.stat-percent { font-size: 16px; }

.stat-label { font-size: 12px; color: rgb(113, 128, 119); margin-top: 4px; }

.goal-list { display: grid; gap: 13px; }

.goal-card, .resource-card, .content-card { background: rgb(252, 250, 244); border: 1px solid rgb(232, 224, 208); border-radius: 17px; padding: 20px 22px; }

.goal-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; }

.goal-top { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }

.goal-title { font-weight: 700; font-size: 16px; }

.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 5px 8px; border-radius: 30px; background: rgb(228, 238, 227); color: rgb(55, 100, 88); }

.tag.work { background: rgb(248, 228, 217); color: rgb(144, 91, 69); }

.subtle { font-size: 12px; color: rgb(118, 133, 123); }

.progress-track { height: 6px; background: rgb(229, 227, 214); border-radius: 8px; overflow: hidden; margin: 13px 0px 7px; }

.progress-fill { height: 100%; background: rgb(227, 160, 135); border-radius: inherit; transition: width 0.35s; }

.goal-actions { display: flex; align-items: flex-start; gap: 7px; }

.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgb(228, 221, 207); background: rgb(250, 247, 239); color: rgb(86, 115, 104); border-radius: 9px; text-decoration: none; }

.icon-btn:hover { background: rgb(232, 238, 228); }

.steps-list { display: grid; gap: 9px; margin-top: 13px; }

.step-row { display: flex; align-items: center; gap: 9px; color: rgb(82, 102, 93); font-size: 13px; }

.step-row input { accent-color: rgb(57, 114, 101); width: 16px; height: 16px; }

.step-completed { text-decoration: line-through; opacity: 0.64; }

.empty-card { background: rgb(244, 236, 221); border: 1px dashed rgb(200, 189, 168); border-radius: 18px; padding: 30px; text-align: center; }

.empty-icon { width: 48px; height: 48px; background: rgb(220, 232, 217); border-radius: 16px; display: grid; place-items: center; margin: 0px auto 14px; color: rgb(51, 103, 90); }

.empty-card h3 { font: 700 18px var(--app-font-serif); margin-bottom: 7px; }

.empty-card p { font-size: 13px; color: rgb(110, 124, 114); max-width: 350px; margin: 0px auto 16px; line-height: 1.6; }

.resource-grid { display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 15px; }

.resource-card { display: flex; flex-direction: column; min-height: 205px; transition: transform 0.2s, border-color 0.2s; }

.resource-card:hover { transform: translateY(-3px); border-color: rgb(185, 203, 185); }

.resource-card h3 { font: 700 18px var(--app-font-serif); margin: 12px 0px 7px; }

.resource-card p { font-size: 13px; line-height: 1.55; color: rgb(105, 121, 111); margin-bottom: 18px; }

.resource-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 11px; color: rgb(116, 132, 123); }

.resource-actions { display: flex; gap: 8px; }

.toolbar { display: flex; gap: 10px; margin: 25px 0px 20px; align-items: center; }

.toolbar .subtle { margin-right: auto; }

.toolbar select { width: auto; min-width: 170px; }

.search-wrap { position: relative; flex: 1 1 0%; }

.search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: rgb(116, 132, 123); }

.search-wrap input { padding-left: 40px; width: 100%; }

.field, select, textarea { width: 100%; border: 1px solid rgb(216, 209, 193); background: rgb(255, 253, 247); border-radius: 10px; padding: 11px 12px; color: rgb(41, 72, 63); outline: none; font-size: 13px; }

.field:focus, select:focus, textarea:focus { border-color: rgb(107, 152, 136); box-shadow: rgba(107, 152, 136, 0.118) 0px 0px 0px 3px; }

.form-grid { display: grid; gap: 14px; }

.form-label { display: block; font-size: 12px; font-weight: 700; color: rgb(79, 103, 92); margin-bottom: 6px; }

.form-error { font-size: 12px; color: rgb(169, 68, 59); margin-top: 5px; }

.modal-backdrop { position: fixed; inset: 0px; background: rgba(27, 52, 47, 0.46); z-index: 50; display: grid; place-items: center; padding: 20px; animation: 0.18s ease 0s 1 normal none running fade; }

.modal { width: min(100%, 540px); max-height: 90dvh; overflow: auto; background: rgb(250, 247, 238); border-radius: 22px; padding: 28px; box-shadow: rgba(19, 46, 40, 0.25) 0px 24px 80px; animation: 0.24s ease 0s 1 normal none running rise; }

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

.modal-header h2 { margin: 0px; }

.modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }

.toast { position: fixed; z-index: 70; right: 24px; bottom: 24px; background: rgb(36, 88, 79); color: rgb(255, 249, 238); padding: 13px 18px; border-radius: 12px; box-shadow: rgba(25, 59, 50, 0.19) 0px 9px 30px; font-size: 13px; animation: 0.2s ease 0s 1 normal none running rise; }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.settings-card { padding: 24px; background: rgb(252, 250, 244); border: 1px solid rgb(232, 224, 208); border-radius: 18px; }

.settings-card h3 { font: 700 18px var(--app-font-serif); }

.settings-card p { font-size: 13px; color: rgb(111, 127, 117); line-height: 1.6; }

.setting-icon { margin: 0px 0px 16px; }

.setting-button { margin-top: 14px; }

.setting-count { margin-bottom: 15px; }

.reset-card { grid-column: 1 / -1; border-color: rgb(225, 201, 184); }

.privacy-card { margin-top: 18px; display: flex; gap: 12px; align-items: flex-start; }

.privacy-card p { margin: 0px; font-size: 12px; color: rgb(118, 133, 123); line-height: 1.7; }

.privacy-icon { color: rgb(100, 135, 120); flex: 0 0 auto; }

.resource-note { margin-top: 24px; display: flex; gap: 14px; align-items: flex-start; }

.resource-note-icon { color: rgb(100, 135, 120); flex: 0 0 auto; }

.resource-note strong { font-size: 13px; }

.resource-note p { margin: 5px 0px 0px; line-height: 1.6; }

.resource-count { margin-bottom: 14px; }

.share-row { display: flex; justify-content: flex-end; margin-top: 18px; }

.inspiration-heading { margin-top: 42px; }

.creator-panel { display: grid; grid-template-columns: minmax(240px, 0.78fr) 1.22fr; gap: clamp(24px, 5vw, 64px); align-items: center; margin-top: 22px; padding: clamp(20px, 4vw, 42px); border-radius: 24px; background: rgb(220, 232, 217); }

.creator-photo-frame { width: 100%; max-width: 360px; justify-self: center; overflow: hidden; border: 8px solid rgb(244, 238, 224); border-radius: 24px 24px 24px 6px; box-shadow: rgba(25, 59, 50, 0.125) 0px 18px 50px; background: rgb(244, 238, 224); }

.creator-photo { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 48%; }

.creator-copy h1 { margin: 18px 0px 14px; font-size: clamp(30px, 4vw, 46px); overflow-wrap: anywhere; }

.creator-name-second { color: rgb(179, 110, 87); }

.creator-copy .lead { margin-bottom: 20px; }

.about-project-card { margin-top: 24px; padding: clamp(22px, 4vw, 38px); background: rgb(252, 250, 244); border: 1px solid rgb(232, 224, 208); border-radius: 20px; }

.about-project-card h2 { margin: 10px 0px 12px; }

.about-project-card p { max-width: 780px; color: rgb(105, 121, 111); font-size: 14px; line-height: 1.75; }

.page-heading { margin-top: 6px; }

.page-heading h1 { margin: 0px 0px 8px; }

.page-heading .lead { margin-bottom: 0px; }

.modal-header h2 { margin: 0px; }

.modal-header .icon-btn { flex: 0 0 auto; }

.form-grid label { min-width: 0px; }

.form-grid textarea { resize: vertical; }

.form-grid [hidden] { display: none; }

.icon-btn svg, .btn svg, .nav-link svg, .brand-mark svg { flex: 0 0 auto; }

.icon-btn:focus-visible, .btn:focus-visible, .nav-link:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: rgb(107, 152, 136) solid 3px; outline-offset: 2px; }

.btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }

.resource-toolbar .search-wrap { min-width: 220px; }

.empty-card .btn { margin-top: 2px; }

.mobile-head { display: none; }

@keyframes fade { 
  0% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes rise { 
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0px); }
}

@media (max-width: 820px) {
  .side-nav { width: 100%; height: 68px; inset: auto 0px 0px; padding: 6px 8px; flex-direction: row; justify-content: space-around; align-items: center; }
  .brand, .nav-label, .nav-footer { display: none; }
  .nav-link { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; font-size: 10px; margin: 0px; }
  .nav-link svg { width: 19px; height: 19px; }
  .main-area { margin-left: 0px; padding: 28px 20px 100px; }
  .page-topline { margin-bottom: 22px; }
  .hero-panel { padding: 26px 23px; grid-template-columns: 1fr; }
  .hero-aside { display: none; }
  .stat-strip { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 560px) {
  .main-area { padding: 23px 16px 95px; }
  .resource-grid, .settings-grid { grid-template-columns: 1fr; }
  .hero-panel { border-radius: 18px; }
  .hero-panel h1 { font-size: 34px; }
  .goal-card { grid-template-columns: 1fr; }
  .goal-actions { justify-content: flex-end; }
  .toolbar { align-items: stretch; flex-wrap: wrap; }
  .toolbar select { width: 100%; }
  .stat-box { padding: 13px 11px; }
  .stat-value { font-size: 21px; }
  .stat-label { font-size: 10px; }
  .section-heading { margin-top: 28px; }
  .modal { padding: 22px; }
  .page-topline { font-size: 11px; gap: 10px; align-items: flex-start; }
  .privacy-note { max-width: 50%; text-align: right; justify-content: flex-end; }
  .resource-toolbar .search-wrap { min-width: 100%; }
  .page-heading { align-items: flex-start; }
  .page-heading .btn { white-space: nowrap; }
  .creator-panel { grid-template-columns: 1fr; gap: 22px; padding: 20px; }
  .creator-photo-frame { max-width: 280px; }
  .creator-copy h1 { font-size: 32px; }
  .creator-copy .lead { font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
}

/* Compléments */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.main-area:focus { outline: none; }
.modal-text { font-size: 14px; line-height: 1.6; color: rgb(105, 121, 111); margin: 0; }
.goal-card .step-row { cursor: pointer; }
a.brand:focus-visible { outline-offset: 4px; }


@media (max-width: 820px) {
  .toast { left: 16px; right: 16px; bottom: 84px; text-align: center; }
}


/* Inscription */
.signup-wrap { display:grid; grid-template-columns:minmax(220px,.8fr) minmax(300px,1.2fr); gap:clamp(22px,5vw,56px); align-items:start; margin-top:22px; }
.signup-intro { padding:18px 0; }
.signup-intro h1 { margin-top:18px; }
.signup-card { background:rgb(252,250,244); border:1px solid rgb(232,224,208); border-radius:20px; padding:clamp(20px,4vw,34px); box-shadow:rgba(25,59,50,.06) 0 12px 34px; }
.signup-fields { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.signup-fields label { min-width:0; }
.signup-full { grid-column:1 / -1; }
.signup-submit,.google-button { width:100%; margin-top:18px; min-height:45px; }
.signup-divider { display:flex; align-items:center; gap:12px; color:rgb(118,133,123); font-size:12px; margin:18px 0 0; }
.signup-divider::before,.signup-divider::after { content:""; height:1px; background:rgb(228,221,207); flex:1; }
.google-button { display:inline-flex; justify-content:center; align-items:center; gap:12px; border:1px solid rgb(216,209,193); border-radius:11px; padding:11px 16px; background:white; color:rgb(55,65,81); font-size:13px; font-weight:700; }
.google-button:hover { background:rgb(248,249,250); }
.signup-note { color:rgb(118,133,123); font-size:11px; line-height:1.6; margin:18px 0 0; }
.signup-back { text-align:center; font-size:12px; margin:18px 0 0; }
.signup-back a { color:rgb(55,100,88); font-weight:700; text-decoration:none; }
@media(max-width:820px) { .signup-wrap { grid-template-columns:1fr; gap:12px; } .signup-intro { padding:0; } }
@media(max-width:560px) { .signup-fields { grid-template-columns:1fr; } .signup-full { grid-column:auto; } }

/* Mot de passe + compte */
.pw-wrap { position:relative; }
.pw-wrap .field { padding-right:46px; }
.pw-toggle { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:8px; background:transparent; color:rgb(86,115,104); }
.pw-toggle:hover { background:rgb(232,238,228); }
.pw-toggle:focus-visible { outline:rgb(107,152,136) solid 3px; outline-offset:1px; }
.field[aria-invalid="true"] { border-color:rgb(169,68,59); }
.form-error-top { margin:0 0 14px; padding:10px 12px; border-radius:10px; background:rgb(250,232,228); }
.google-slot { display:flex; justify-content:center; margin-top:18px; min-height:44px; }
.setting-actions { display:flex; flex-wrap:wrap; gap:9px; }
.signup-back a:focus-visible { outline:rgb(107,152,136) solid 3px; outline-offset:2px; border-radius:4px; }

</style>
</head>
<body>
  <div id="app">
    <noscript>Max tel a besoin de JavaScript pour fonctionner.</noscript>
  </div>
  <script src="app.js"></script>
</body>
</html>
